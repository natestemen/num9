[package]
name = "num9-core"
version = "0.1.0"
edition = "2021"
description = "Fast NMBR 9 engine and strategies, with Python bindings"

[lib]
name = "num9_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "brute"
path = "src/bin/brute.rs"

[[bin]]
name = "freemax"
path = "src/bin/freemax.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "arena"
path = "src/bin/arena.rs"

[[bin]]
name = "decisions"
path = "src/bin/decisions.rs"

[[bin]]
name = "solve"
path = "src/bin/solve.rs"

[[bin]]
name = "maxscore"
path = "src/bin/maxscore.rs"

[[bin]]
name = "tower"
path = "src/bin/tower.rs"

[[bin]]
name = "widening"
path = "src/bin/widening.rs"

[features]
# Build the Python extension module (enabled by maturin, see pyproject.toml).
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }

[workspace]
members = [".", "cli", "web"]

[profile.release]
lto = true
codegen-units = 1
